<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skill Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Skill Calculator</h1>

    <!-- STEP 1 -->
    <section class="panel">
      <h2 class="step-title">1. Choose a skill</h2>
      <div id="skillGrid" class="skill-grid"></div>
    </section>

        <!-- STEP 2 -->
    <section class="panel" id="step2" hidden>
      <h2 class="step-title">2. Set your levels</h2>

      <!-- Character lookup (a real <form> so mobile keyboards' Go/Search key works) -->
      <form id="lookupForm" class="lookup-bar" autocomplete="off">
        <label for="playerName" id="lookupLabel">Character name</label>
        <div class="lookup-row" id="lookupBar">
          <input
            type="text"
            id="playerName"
            placeholder="Enter character name"
            enterkeyhint="search"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            inputmode="text"
          />
          <button type="submit" id="lookupBtn">Look up</button>
        </div>
        <p id="lookupStatus" class="lookup-status" aria-live="polite"></p>
      </form>

      <div class="level-grid">
        <div class="level-card">
          <span class="level-label">Current level</span>
          <input id="currentLevel" type="number" min="1" max="199" value="1" />
          <span class="level-sub">Current XP (optional)</span>
          <input id="currentXp" type="number" min="0" step="1" placeholder="Enter your exact XP..." />
        </div>

        <div class="level-card">
          <span class="level-label">Target level</span>
          <input id="targetLevel" type="number" min="2" max="200" placeholder="e.g. 99" />
          <span class="level-sub">Target XP (optional)</span>
          <input id="targetXp" type="number" min="0" step="1" placeholder="Enter your exact XP..." />
        </div>
      </div>
    </section>

    <!-- STEP 3 -->
    <section class="panel" id="step3" hidden>
      <h2 class="step-title" id="step3Title">3. Choose a task</h2>

      <!-- Global: applies to every skill -->
      <label class="log-row">Burning logs bonus
        <select id="logSelect"></select>
      </label>

      <!-- Skill-specific: each skill module renders its own controls here -->
      <div id="skillTask"></div>

      <button id="calcBtn" type="button">Calculate</button>
    </section>

    <!-- RESULTS -->
    <section class="panel" id="resultPanel" hidden>
      <h2 class="step-title">Your plan</h2>
      <div id="result"></div>
    </section>

    <p class="back"><a href="index.html">← Back</a></p>
  </main>

  <script type="module" src="calculator.js"></script>
</body>
</html>

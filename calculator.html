<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skill Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Skill Calculator</h1>

    <label>Current level
      <input id="currentLevel" type="number" min="1" max="199" value="1" />
    </label>

    <label>Target level
      <input id="targetLevel" type="number" min="2" max="200" value="99" />
    </label>

    <label>XP per action (optional)
      <input id="xpPerAction" type="number" min="0" step="0.25" value="0" />
    </label>

    <button id="calcBtn">Calculate</button>
    <div id="result"></div>

    <p><a href="index.html">← Back</a></p>
  </main>

  <script src="calculator.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skill Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Skill Calculator</h1>

    <label>Current level
      <input id="currentLevel" type="number" min="1" max="199" value="1" />
    </label>

    <label>Current XP (optional, overrides current level)
      <input id="currentXp" type="number" min="0" step="1" placeholder="e.g. 50000" />
    </label>

    <label>Target level
      <input id="targetLevel" type="number" min="2" max="200" value="99" />
    </label>

    <label>Target XP (optional, overrides target level)
      <input id="targetXp" type="number" min="0" step="1" placeholder="e.g. 100000" />
    </label>

    <label>XP per action (optional)
      <input id="xpPerAction" type="number" min="0" step="0.25" value="0" />
    </label>

    <section id="miningSection">
      <h2>⛏️ Mining</h2>

      <label>Burning logs bonus
        <select id="logSelect"></select>
      </label>

      <div class="ore-controls">
        <strong>Ores to mine</strong>
        <button type="button" id="selectAllBtn">Select all</button>
        <button type="button" id="clearBtn">Clear</button>
      </div>
      <div id="oreGrid" class="ore-grid"></div>

      <div id="mixSection" style="display:none;">
        <strong>XP split between selected ores (%)</strong>
        <div id="mixInputs" class="mix-inputs"></div>
        <p class="note" id="mixTotal"></p>
      </div>
    </section>

    <button id="calcBtn">Calculate</button>
    <div id="result"></div>

    <p><a href="index.html">← Back</a></p>
  </main>

  <script src="calculator.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My First Site</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .home-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-height: 100vh;
      max-width: none;
      padding: 24px 16px;
      text-align: center;
    }
    .home-title { margin: 0; font-size: clamp(3rem, 10vw, 6rem); }
    .home-sub { margin: 0 0 12px; font-size: 1.4rem; color: #7d8bc4; }
    .home-btn {
      display: inline-block;
      padding: 16px 44px;
      background: #f5b82e;
      border-radius: 12px;
      color: #1a1205;
      font-size: 1.3rem;
      font-weight: 700;
      text-decoration: none;
    }
    .home-btn:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <main class="home-main">
    <h1 class="home-title">Hello!</h1>
    <p class="home-sub">Welcome to my site</p>
    <a class="home-btn" href="calculator.html">Skill Calculator</a>
  </main>
</body>
</html>
